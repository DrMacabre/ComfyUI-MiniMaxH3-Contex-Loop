[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-minimaxh3-master"
description = "DrMacabre's independent MiniMax H3 MASTER workflow runtime for ComfyUI, with isolated node ids, frontend events, API routes, exact timelines, references, review and export controls."
version = "0.1.0"
license = "GPL-3.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DrMacabre" },
]
keywords = [
    "comfyui",
    "minimax-h3",
    "video-generation",
    "audio",
    "master-workflow",
    "checkpoint",
    "resume",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/DrMacabre/ComfyUI-MiniMaxH3-Contex-Loop/tree/master-companion-nodepack"
Repository = "https://github.com/DrMacabre/ComfyUI-MiniMaxH3-Contex-Loop"
Upstream = "https://github.com/ethanfel/ComfyUI-MiniMaxH3-Contex-Loop"

[tool.comfy]
PublisherId = "drmacabre"
DisplayName = "MiniMax H3 MASTER"

[tool.setuptools]
packages = []
