name: MiniMax H3 master simple UI

on:
  push:
    branches:
      - master-workflow-simple-ui
  pull_request:
    branches:
      - fool-for-love-upstream-0.6.37

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy av safetensors
      - name: Compile simplified master backend
        run: |
          python -m py_compile master_simple_ui.py master_export_simple.py __init__.py
      - name: Run simplified master contract regression
        run: python tests/_master_simple_ui_unit_test.py
      - name: Diff hygiene
        run: git diff --check fool-for-love-upstream-0.6.37...HEAD
