name: MiniMax H3 master simple UI

on:
  push:
    branches:
      - master-workflow-simple-ui
  pull_request:
    branches:
      - fool-for-love-upstream-0.6.37

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy av safetensors
      - name: Compile simplified master backend and migrators
        run: |
          python -m py_compile master_simple_ui.py master_export_simple.py master_video_mode.py master_policy_router.py exact_generated_audio_tail_0637.py master_export_audio_verify_0637.py tools/build_master_workflow.py tools/repack_master_workflow.py tools/patch_master_runtime_v1.py tools/patch_master_runtime_v2.py __init__.py
      - name: Run simplified master UI contract regression
        run: python tests/_master_simple_ui_unit_test.py
      - name: Run simplified master policy regression
        run: python tests/_master_policy_router_unit_test.py
      - name: Run exact generated-audio tail regression
        run: python tests/_exact_generated_audio_tail_unit_test.py
      - name: Run master export audio verification regression
        run: python tests/_master_export_audio_verify_unit_test.py
      - name: Verify master work did not modify Exact Final Timeline guard
        run: git diff --exit-code origin/fool-for-love-upstream-0.6.37...HEAD -- exact_final_timeline.py
      - name: Run deterministic workflow migration regression
        run: python tests/_master_workflow_migrator_test.py
      - name: Run compact reference-bank layout regression
        run: python tests/_master_reference_layout_test.py
      - name: Run master web UI surface regression
        run: python tests/_master_simple_ui_surface_test.py
      - name: Run runtime smoke 01 workflow patch regression
        run: python tests/_master_runtime_patch_test.py
      - name: Run runtime smoke 02 metadata patch regression
        run: python tests/_master_runtime_patch_v2_test.py
      - name: Run detached Run Manager asset regression
        run: node tests/_master_detached_assets_unit_test.mjs
      - name: Diff hygiene
        run: git diff --check origin/fool-for-love-upstream-0.6.37...HEAD
