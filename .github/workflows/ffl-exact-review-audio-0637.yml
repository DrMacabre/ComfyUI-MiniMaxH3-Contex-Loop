name: FFL 0.6.37 exact-final review audio

on:
  push:
    branches:
      - fool-for-love-upstream-0.6.37

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fool-for-love-upstream-0.6.37
          fetch-depth: 0
      - name: Apply focused Exact Final Timeline Review audio patch
        run: python tools/ffl_patch_exact_review_audio_0637.py
      - name: Compile backend
        run: python -m py_compile chain_nodes.py exact_final_timeline.py exact_final_timeline_continuation_0637.py review_cleanup_win32_0637.py
      - name: Verify continuation sanitation regression
        env:
          PYTHONPATH: .
        run: python tests/_exact_final_timeline_continuation_0637_unit_test.py
      - name: Verify narrow Windows Review cleanup guard
        run: python tests/_review_cleanup_win32_0637_unit_test.py
      - name: Verify frontend exact-final regression
        run: node tests/_plan_editor_js_test.mjs
      - name: Verify Chain Review frontend regression
        run: node tests/_chain_review_js_test.mjs
      - name: Focused Review-audio contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          exact = Path('exact_final_timeline.py').read_text(encoding='utf-8')
          cleanup = Path('review_cleanup_win32_0637.py').read_text(encoding='utf-8')
          init = Path('__init__.py').read_text(encoding='utf-8')
          required = [
              '_ORIG_REVIEW_VIDEO = _chain._review_video',
              'def _review_video_exact(',
              'audio = _trim_audio_to_frames(audio, delivered)',
              '_chain._review_video = _review_video_exact',
          ]
          cleanup_required = [
              'activate_review_cleanup_win32_guard',
              'getattr(exc, "winerror", None) == 32',
              'filename.startswith("clip_")',
              'filename.endswith(".review.mp4")',
          ]
          missing = [item for item in required if item not in exact]
          missing += [item for item in cleanup_required if item not in cleanup]
          if '_EXACT_FINAL_REVIEW_CLEANUP_WIN32 = _activate_review_cleanup_win32_guard(' not in init:
              missing.append('narrow review cleanup WinError32 activation')
          if missing:
              raise SystemExit('missing review-audio/cleanup contract: ' + repr(missing))
          print('PASS exact-final Review audio + narrow WinError32 cleanup contract')
          PY
      - name: Diff hygiene
        run: |
          git diff --check
          git diff -- exact_final_timeline.py review_cleanup_win32_0637.py __init__.py
      - name: Commit validated backend fix when needed
        run: |
          if git diff --quiet -- exact_final_timeline.py; then
            echo "Exact-final Review audio patch already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exact_final_timeline.py
          git commit -m "fix: conform exact-final Review audio to delivered frames"
          git push origin HEAD:fool-for-love-upstream-0.6.37
