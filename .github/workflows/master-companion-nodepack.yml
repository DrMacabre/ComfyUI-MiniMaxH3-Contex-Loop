name: MASTER companion nodepack

on:
  push:
    branches:
      - master-companion-nodepack
  pull_request:
    branches:
      - master-companion-nodepack

jobs:
  static-companion-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile companion entrypoint and helpers
        run: |
          python -m py_compile __init__.py companion_namespace.py companion_runtime_policy.py companion_core_compat.py tools/migrate_workflow_to_companion.py tools/preflight_companion_runtime.py tools/check_companion_static.py tools/check_companion_runtime_literals.py tools/check_companion_no_global_patches.py tools/check_companion_core_compat.py tools/check_companion_migration.py
      - name: Run standalone isolation checks
        run: python tools/check_companion_static.py
      - name: Run runtime node-id literal rewrite check
        run: python tools/check_companion_runtime_literals.py
      - name: Enforce no shared-core patch contract
        run: python tools/check_companion_no_global_patches.py
      - name: Validate scoped core compatibility helpers
        run: python tools/check_companion_core_compat.py
      - name: Validate workflow migration routing
        run: python tools/check_companion_migration.py
